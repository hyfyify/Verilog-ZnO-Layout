[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zno-layout"
version = "0.1.0"
description = "Experimental Verilog-to-mask compiler for additive ZnO TFT processes"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hyfyify"}]

[project.scripts]
zno-layout = "zno_layout.cli:main"
zno-layout-web = "zno_layout.web:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
zno_layout = ["web/*.html"]
